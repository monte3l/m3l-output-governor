version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # A freshly published action version is the window an attacker needs;
    # the default cooldown of 0 leaves it open.
    cooldown:
      default-days: 7
    labels:
      - dependencies

  # .github/ci-tools/ pins the Claude Code version verify.yml installs. A bump
  # can change how the plugin is validated, so it arrives as a reviewed PR with
  # a one-day cooldown.
  - package-ecosystem: npm
    directory: /.github/ci-tools
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 1
    labels:
      - dependencies

  # .github/deploy-tools/ pins the wrangler version docs.yml deploys with. A bump
  # can change how the site is published, so it arrives as a reviewed PR with a
  # one-day cooldown.
  - package-ecosystem: npm
    directory: /.github/deploy-tools
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 1
    labels:
      - dependencies
