name: Dependency Review

# On every pull request, scans the dependency changes it introduces and fails
# on a high-severity known vulnerability or a license outside the allowed
# list. Runs GitHub's own dependency-review-action; nothing is installed or
# built. Needs a public repository, or a private one with GitHub Code Security.
on:
  pull_request:
    branches: [$default-branch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # Permissive licenses only. Add a license here only after checking
          # that this project can accept its terms.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, CC-BY-4.0, BlueOak-1.0.0, Artistic-2.0, CC-BY-3.0
          # A copyleft or platform-specific package that is acceptable for a
          # tool the project only runs (never ships) is exempted by package
          # URL, not by adding its license above. Example:
          # allow-dependencies-licenses: pkg:npm/%40img/sharp-libvips-linux-x64
