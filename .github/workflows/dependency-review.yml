name: Dependency Review

# On every pull request, scans the dependency changes it introduces and fails
# on a high-severity known vulnerability or a license outside the allowed
# list. Runs GitHub's own dependency-review-action; nothing is installed or
# built. Needs a public repository, or a private one with GitHub Code Security.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # Permissive licenses only. Add a license here only after checking
          # that this project can accept its terms.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, CC-BY-4.0, BlueOak-1.0.0, Artistic-2.0, CC-BY-3.0
          # BlueOak-1.0.0, Artistic-2.0 and CC-BY-3.0 cover the dependency tree
          # of wrangler in .github/deploy-tools. All are permissive; this repo
          # never redistributes them.
          #
          # Per-package, not per-license: the pinned Claude Code CLI in
          # .github/ci-tools (verify.yml) and its platform binaries carry
          # Anthropic's proprietary licence ("SEE LICENSE IN ..."). They are
          # only installed in a CI job and never redistributed.
          # Also per-package: wrangler pulls in sharp's prebuilt libvips
          # binaries, which carry LGPL-3.0-or-later. They are only installed
          # (--ignore-scripts) in a CI job that uploads static HTML to
          # Cloudflare, never shipped to anyone.
          allow-dependencies-licenses: >-
            pkg:npm/%40anthropic-ai/claude-code,
            pkg:npm/%40anthropic-ai/claude-code-darwin-arm64,
            pkg:npm/%40anthropic-ai/claude-code-darwin-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64-musl,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64-musl,
            pkg:npm/%40anthropic-ai/claude-code-win32-arm64,
            pkg:npm/%40anthropic-ai/claude-code-win32-x64,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64
