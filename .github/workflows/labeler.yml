name: Label PRs by area

# Applies the area labels that .github/labeler.yml defines (area:ci,
# area:docs, ...) from the paths a pull request changes, so the PR list reads
# by area. Labels only: it never blocks anything, and it is not a required
# check. Start from blueprint/files/labeler.yml.
#
# The shared area:* labels exist already when apply-repo-baseline.sh has run.
# A label that is specific to the repository is created by the action in
# GitHub's default grey the first time it applies it, so create those by hand
# first. `pull-requests: write` is enough: `issues: write` is not needed.
#
# `pull_request`, never `pull_request_target`: the checked-out code is never
# run, the action only reads the changed-file list through the API, and that
# keeps it clear of the "dangerous workflow" class Scorecard flags. A fork PR
# gets a read-only token, so a repository that accepts fork PRs sees the job
# fail there without labelling.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dependabot's pull_request runs get a read-only GITHUB_TOKEN, so the job
    # could only fail there; its PRs already carry the `dependencies` label.
    # Keyed on who opened the PR, not `github.actor`, which is whoever
    # triggered this run (a human re-running it, say).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
